[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walker2d-ppo-learning"
version = "0.1.0"
description = "A teaching-first, from-scratch PPO project for Gymnasium Walker2d-v5."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "gymnasium[mujoco]>=1.2,<2",
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
  "matplotlib>=3.8,<4",
  "imageio>=2.34,<3",
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
notebook = [
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
  "nbformat>=5,<6",
  "nbclient>=0.10,<1",
]

[project.scripts]
walker2d-train = "walker2d_ppo.cli:train_main"
walker2d-evaluate = "walker2d_ppo.cli:evaluate_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

